<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { 
      font-family: 'Noto Sans JP', sans-serif; 
      background-color: #F0F2F5; 
      margin: 0; 
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header { background-color: var(--color-text-main); color: white; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; flex-shrink: 0; }
    .header h1 { color: white; font-size: 1.2rem; margin: 0; }
    .meta-info { font-size: 0.85rem; color: var(--color-text-sub); }
    
    .btn-block-action {
      background-color: #555 !important;
      color: #fff !important;
      border-color: #555 !important;
    }
    .btn-outline.btn-block-action {
      background-color: transparent !important;
      color: #555 !important;
      border-color: #999 !important;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>HR 予約管理システム</h1>
  </header>

  <div class="admin-container">
    
    <div class="admin-layout">
      <!-- Sidebar Controls -->
      <div class="card admin-sidebar" style="padding: 1rem;">
        
        <!-- Date -->
        <div class="admin-sidebar-section">
          <div class="admin-sidebar-section-title">日付選択</div>
          <div style="display: flex; gap: 0.5rem; align-items: center; justify-content: space-between;">
            <button class="btn btn-outline" id="prev-day" style="padding: 0.5rem 1rem;">&lt;</button>
            <input type="date" id="current-date" class="form-input" style="width: 100%; text-align: center; margin: 0; padding: 0.5rem;">
            <button class="btn btn-outline" id="next-day" style="padding: 0.5rem 1rem;">&gt;</button>
          </div>
        </div>
        
        <!-- Menus -->
        <div class="admin-sidebar-section" style="margin-top: 1rem;">
          <div class="admin-sidebar-section-title">メニュー選択</div>
          <button class="btn btn-outline btn-full mobile-menu-toggle" id="mobile-menu-toggle">
            メニューを選択 ▼
          </button>
          <div id="menu-buttons" class="menu-buttons-container mobile-accordion-content">
            <button class="btn btn-outline menu-btn btn-full" data-duration="60" data-type="booked" data-name="カット">カット (60分)</button>
            <button class="btn btn-outline menu-btn btn-full" data-duration="90" data-type="booked" data-name="カラー">カラー (90分)</button>
            <button class="btn btn-outline menu-btn btn-full" data-duration="120" data-type="booked" data-name="パーマ">パーマ (120分)</button>
          </div>
        </div>

        <!-- Block Mode -->
        <div class="admin-sidebar-section" style="margin-top: 1rem; border-top: 1px dashed var(--color-border); padding-top: 1.5rem;">
          <div class="admin-sidebar-section-title">スケジュール調整</div>
          <button class="btn btn-outline btn-block-action btn-full" id="btn-block-mode">ブロック選択</button>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <button class="btn btn-block-action d-none btn-full" id="btn-block-confirm" style="flex: 1;">確定</button>
            <button class="btn btn-outline btn-block-action d-none btn-full" id="btn-block-cancel" style="flex: 1;">解除</button>
          </div>
        </div>

      </div>

      <!-- Timeline Grid -->
      <div class="timeline-container" id="timeline" style="flex: 1; overflow-y: auto;">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- Booking Modal -->
  <div id="booking-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem; position: relative;">
      <h3 class="mb-4 text-center">電話予約の登録</h3>
      
      <div style="background-color: var(--color-base); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
        <div class="meta-info mb-2" id="modal-datetime">2026年8月15日(土) 10:00 〜</div>
        <div style="font-weight: bold;" id="modal-menu">カット (60分)</div>
        <div class="meta-info mt-1" id="modal-staff">担当: スタッフA</div>
      </div>

      <form id="proxy-booking-form">
        <div class="form-group">
          <label class="form-label">お客様名 (必須)</label>
          <div class="autocomplete-wrapper">
            <input type="text" id="proxy-name" class="form-input" required placeholder="小布施 太郎" autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-list d-none"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">電話番号 <span style="color:red">*</span></label>
          <input type="tel" id="proxy-phone" class="form-input" placeholder="例: 090-1234-5678" required>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="button" class="btn btn-outline btn-full" id="btn-close-modal">キャンセル</button>
          <button type="submit" class="btn btn-full">予約を確定する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Details & Cancel Modal -->
  <div id="details-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem; position: relative;">
      <h3 class="mb-4 text-center">予約の詳細</h3>
      
      <div style="background-color: var(--color-base); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
        <div class="meta-info mb-2" id="detail-datetime"></div>
        <div style="font-weight: bold;" id="detail-menu"></div>
        <div class="meta-info mt-1" id="detail-staff"></div>
      </div>
      
      <div class="form-group">
        <label class="form-label">お客様名 (内容)</label>
        <div id="detail-name" style="font-size: 1.1rem; font-weight: bold;"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2rem;">
        <button type="button" class="btn btn-outline btn-full" style="color: #721C24; border-color: #721C24;" id="btn-cancel-booking">この予定をキャンセル（削除）する</button>
        <button type="button" class="btn btn-outline btn-full" id="btn-close-details">閉じる</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
