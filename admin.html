<!DOCTYPE html>
<html lang="ja">
<head>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=69">
  <style>
    body { 
      font-family: 'Noto Sans JP', sans-serif; 
      background-color: #F0F2F5; 
      margin: 0; 
      padding: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header { background-color: var(--color-text-main); color: white; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; flex-shrink: 0; }
    .header h1 { color: white; font-size: 1.2rem; margin: 0; }
    .meta-info { font-size: 0.85rem; color: var(--color-text-sub); }
    
    .btn-block-action {
      background-color: #555 !important;
      color: #fff !important;
      border-color: #555 !important;
    }
    .btn-outline.btn-block-action {
      background-color: transparent !important;
      color: #555 !important;
      border-color: #999 !important;
    }
  </style>
<style>
@media (max-width: 767px) {
  #customer-list-table {
    table-layout: fixed;
    word-wrap: break-word;
  }
  #customer-list-table th, #customer-list-table td {
    padding: 0.5rem 0.25rem !important;
  }
  #customer-list-table td div {
    font-size: 0.9rem !important;
  }
  #customer-list-table td button {
    padding: 0.3rem 0.4rem !important;
    font-size: 0.75rem !important;
    white-space: normal !important;
    word-break: keep-all;
  }
}
</style>

<style>
@media print {
  .print-only { display: block !important; }
  body, html {
    height: auto !important;
    overflow: visible !important;
    background-color: white !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .header, .admin-sidebar, #details-modal, #booking-modal, #customer-mgmt-modal, button {
    display: none !important;
  }
  .admin-layout {
    display: block !important;
    height: auto !important;
  }
  #main-admin-content {
    padding: 0 !important;
    display: block !important;
    height: auto !important;
  }
  #timeline {
    overflow: visible !important;
    border: none !important;
    padding: 0 !important;
    display: block !important;
  }
  #date-display {
    display: block !important;
    border: none !important;
    font-size: 1.2rem !important;
    font-weight: bold !important;
    text-align: center !important;
    margin-bottom: 5px !important;
    padding: 0 !important;
  }
  .timeline-table th, .timeline-table td {
    padding: 0.2rem !important;
    font-size: 0.75rem !important;
    line-height: 1.1 !important;
  }
  * {
    -webkit-print-color-adjust: exact !important;
    color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  @page {
    size: A4 portrait;
    margin: 10mm;
  }
}
</style>
</head>
<body>
  <header class="header">
    <h1>HR 予約管理システム</h1>
  </header>

  <div class="admin-container" id="main-admin-content">
    
    <div class="admin-layout">
      <!-- Sidebar Controls -->
      <div class="card admin-sidebar" style="padding: 1rem;">
        
        <!-- Date -->
        <div class="admin-sidebar-section">
          <div style="display: flex; gap: 0.5rem; align-items: center; justify-content: space-between;">
            <button class="btn btn-outline" id="prev-day" style="padding: 0.5rem 1rem;">&lt;</button>
            <div style="position: relative; width: 100%;">
              <input type="date" id="current-date" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2;" onclick="if(this.showPicker) this.showPicker();" title="クリックしてカレンダーを開く">
              <div id="date-display" class="form-input" style="width: 100%; text-align: center; padding: 0.5rem; background-color: var(--color-surface); pointer-events: none; z-index: 1;">
                読み込み中...
              </div>
            </div>
            <button class="btn btn-outline" id="next-day" style="padding: 0.5rem 1rem;">&gt;</button>
            <button class="btn btn-outline" id="btn-print" style="padding: 0.5rem 1rem; margin-left: 0.5rem; white-space: nowrap;" onclick="window.print()" title="予約台帳を印刷（PDF保存）">🖨️ 印刷</button>
          </div>
        </div>
        
        <!-- Action Tabs -->
        <div class="admin-sidebar-section" style="margin-top: 1rem;">
          
          <div style="display: flex; gap: 0.25rem; margin-bottom: 1rem;">
            <button class="btn btn-outline btn-full tab-toggle" id="btn-tab-booking" style="flex: 1; padding: 0.5rem 0; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
              <span>電話予約</span>
            </button>
            <button class="btn btn-outline btn-full tab-toggle" id="btn-tab-block" style="flex: 1; padding: 0.5rem 0; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
              <span>枠ブロック</span>
            </button>
            <button class="btn btn-outline btn-full tab-toggle" id="btn-tab-customer" style="flex: 1; padding: 0.5rem 0; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
              <span>顧客データ</span>
            </button>
          </div>

          <!-- Tab Contents -->
          
          <!-- 1. Phone Booking Content -->
          <div id="tab-content-booking" class="tab-content" style="display: none; margin-bottom: 1rem; padding-top: 0.5rem; border-top: 2px solid var(--color-primary);">
            
            <button type="button" class="btn btn-outline btn-full" id="menu-dropdown-toggle" style="text-align: left; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <strong id="menu-dropdown-text">メニューを選択</strong>
              <span id="menu-dropdown-icon">▼</span>
            </button>

            <div id="menu-buttons" class="menu-buttons-container" style="display: none; max-height: 250px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 0.5rem; background: var(--color-base);">
              <!-- Dynamically generated from GAS -->
            </div>
          </div>

          <!-- 2. Block Slots Content -->
          <div id="tab-content-block" class="tab-content" style="display: none; margin-bottom: 1rem; padding-top: 0.5rem; border-top: 2px solid var(--color-primary);">
            <div style="display: flex; gap: 0.5rem;">
              <button type="button" class="btn btn-outline btn-block-action btn-full" id="btn-block-mode" style="flex: 1;">個別ブロック開始</button>
              <button type="button" class="btn btn-outline btn-full" id="btn-store-allday" style="flex: 1; border-color: #dc3545; color: #dc3545;">店舗一括 終日休</button>
            </div>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
              <button class="btn btn-block-action d-none btn-full" id="btn-block-confirm" style="flex: 1;">設定</button>
              <button class="btn btn-block-action d-none btn-full" id="btn-block-delete" style="flex: 1; background: #dc3545; color: white; border: 1px solid #dc3545;">解除</button>
              
            </div>
          </div>
          
        </div>

      </div>

      <!-- Timeline Grid -->
      <div class="timeline-container" id="timeline" style="flex: 1; overflow-y: auto;">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- Booking Modal -->
  <div id="booking-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem; position: relative; max-height: 90vh; overflow-y: auto;">
      <h3 class="mb-4 text-center">予約の登録</h3>
      
      <div style="background-color: var(--color-base); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
        <div class="mb-2" id="modal-datetime" style="font-size: 1.1rem; font-weight: bold; color: var(--color-text-main);">2026/08/15 (土) 10:00 〜</div>
        <div style="font-weight: bold;" id="modal-menu">カット (60分)</div>
        <div class="meta-info mt-1" id="modal-staff">担当: スタッフA</div>
      </div>

      <form id="proxy-booking-form">
        <div class="form-group">
          <label class="form-label">お客様名 (必須)</label>
          <div class="autocomplete-wrapper">
            <input type="text" id="proxy-name" class="form-input" required autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-list d-none"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">電話番号 (必須)</label>
          <input type="tel" id="proxy-phone" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">ご要望・メモ</label>
            <textarea id="proxy-memo" class="form-input" rows="3"></textarea>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="button" class="btn btn-outline btn-full" id="btn-close-modal">キャンセル</button>
          <button type="submit" class="btn btn-full">予約を確定</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Details & Cancel Modal -->
  <div id="details-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem; position: relative; max-height: 90vh; overflow-y: auto;">
      <h3 class="mb-4 text-center" id="details-modal-title">予約の詳細</h3>
        
        <div style="background-color: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm);">
          
          <div id="detail-datetime-wrapper" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--color-border); margin-bottom: 0.75rem;">
            <span style="color: var(--color-text-sub); font-size: 0.85rem;">日時</span>
            <span id="detail-datetime" style="font-size: 1.05rem; font-weight: bold; color: var(--color-text-main);"></span>
          </div>
        
          <div id="detail-menu-wrapper" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--color-border); margin-bottom: 0.75rem;">
            <span style="color: var(--color-text-sub); font-size: 0.85rem;">メニュー</span>
            <span id="detail-menu" style="font-size: 1.05rem; font-weight: bold; color: var(--color-text-main);"></span>
          </div>
        
          <div id="detail-staff-wrapper" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--color-border); margin-bottom: 0.75rem;">
            <span style="color: var(--color-text-sub); font-size: 0.85rem;">担当スタッフ</span>
            <span id="detail-staff" style="font-size: 1.05rem; font-weight: bold; color: var(--color-text-main);"></span>
          </div>
        
          <div id="detail-name-wrapper" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--color-border); margin-bottom: 0.75rem;">
            <span class="form-label" style="margin: 0; color: var(--color-text-sub); font-size: 0.85rem; font-weight: normal;">お客様名</span>
            <span id="detail-name" style="font-size: 1.05rem; font-weight: bold; color: var(--color-accent); cursor: pointer; text-decoration: underline;"></span>
          </div>
        
          <div id="detail-phone-wrapper" class="d-none" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--color-border); margin-bottom: 0.75rem;">
            <span class="form-label" style="margin: 0; color: var(--color-text-sub); font-size: 0.85rem; font-weight: normal;">電話番号</span>
            <span id="detail-phone" style="font-size: 1.05rem; font-weight: bold; color: var(--color-text-main);"></span>
          </div>
        
          <div id="detail-memo-wrapper" style="margin-top: 0.5rem;">
            <div style="color: var(--color-text-sub); font-size: 0.85rem; margin-bottom: 0.5rem;">ご要望・メモ</div>
            <div id="detail-memo" style="font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; background-color: var(--color-base); padding: 0.75rem; border-radius: var(--radius-sm); color: var(--color-text-main); min-height: 3rem;"></div>
          </div>
        
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2rem;">
        <button type="button" class="btn btn-outline btn-full" style="color: #721C24; border-color: #721C24;" id="btn-cancel-booking">予約をキャンセル(削除)</button>
        <button type="button" class="btn btn-outline btn-full" id="btn-close-details">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Customer Data Modal (View from Booking) -->
  <div id="customer-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem; position: relative; max-height: 90vh; overflow-y: auto; padding: 1.25rem;">
      <h3 class="mb-3 text-center" style="font-size: 1.1rem; color: var(--color-primary); margin-top: 0;">顧客データ</h3>
      
      <div style="background: var(--color-base); border-radius: var(--radius-sm); border: 1px solid var(--color-border); overflow: hidden; margin-bottom: 1.25rem;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 0;">
          <tbody>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); width: 35%; color: var(--color-text-sub); font-weight: normal;">お客様名</th>
              <td style="padding: 0.5rem; font-weight: bold; color: var(--color-text-main);"><div id="customer-name"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">ふりがな</th>
              <td style="padding: 0.5rem;"><div id="customer-kana"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">住所(市町村)</th>
              <td style="padding: 0.5rem;"><div id="customer-address"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">職業</th>
              <td style="padding: 0.5rem;"><div id="customer-occupation"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">電話番号</th>
              <td style="padding: 0.5rem; font-weight: bold;"><div id="customer-phone"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">メール</th>
              <td style="padding: 0.5rem; font-weight: bold; word-break: break-all;"><div id="customer-email"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">初回予約日</th>
              <td style="padding: 0.5rem;"><div id="customer-first-visit"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">最終来店日</th>
              <td style="padding: 0.5rem;"><div id="customer-last-visit"></div></td>
            </tr>
            <tr>
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal; vertical-align: top;">メモ</th>
              <td style="padding: 0.5rem;"><div id="customer-notes" style="white-space: pre-wrap; font-size: 0.85rem; line-height: 1.4;"></div></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div>
        <button type="button" class="btn btn-outline btn-full" id="btn-close-customer">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Customer Management Modal (Edit/Register) -->
  <div id="customer-mgmt-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 600px; margin: 1rem; position: relative; max-height: 90vh; overflow-y: hidden; display: flex; flex-direction: column; padding: 1.25rem;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="margin: 0; font-size: 1.2rem;">顧客データ管理</h3>
        <button id="btn-close-mgmt" style="background:none; border:none; font-size: 1.5rem; cursor: pointer; color: var(--color-text-sub);">&times;</button>
      </div>

      <!-- List/Search View -->
      <div id="customer-list-view" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
          <input type="text" id="customer-search-input" class="form-input" placeholder="名前・ふりがな・電話番号で検索" style="flex: 1;">
          <button class="btn" id="btn-new-customer" style="white-space: nowrap;">＋ 新規登録</button>
        </div>
        
        <div style="background: var(--color-base); border-radius: var(--radius-sm); border: 1px solid var(--color-border); flex: 1; overflow-y: auto;">
          <table id="customer-list-table" style="width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; table-layout: fixed; word-wrap: break-word;">
                                        <thead style="background: #f8fafc; position: sticky; top: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); z-index: 10;">
                <tr>
                  <th style="padding: 1rem; border-bottom: 1px solid var(--color-border); color: #475569; font-weight: 600; width: 45%;">お客様名</th>
                  <th style="padding: 1rem; border-bottom: 1px solid var(--color-border); color: #475569; font-weight: 600; width: 35%;">電話番号</th>
                  <th style="padding: 1rem; border-bottom: 1px solid var(--color-border); color: #475569; font-weight: 600; width: 20%; text-align: right;"></th>
                </tr>
              </thead>
            <tbody id="customer-tbody">
              <!-- JS Populated -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Edit/Register Form View -->
      <div id="customer-form-view" class="d-none" style="flex: 1; overflow-y: auto; padding-right: 0.5rem;">
        <h4 id="customer-form-title" style="margin-top: 0; margin-bottom: 1rem; color: var(--color-primary);">顧客の登録・編集</h4>
        <form id="customer-edit-form">
          <input type="hidden" id="edit-customer-id">
          
          <div class="form-group">
            <label class="form-label">お客様名 (必須)</label>
            <input type="text" id="edit-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">ふりがな</label>
            <input type="text" id="edit-kana" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">電話番号</label>
            <input type="tel" id="edit-phone" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">住所（市町村）</label>
            <input type="text" id="edit-address" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">職業</label>
            <input type="text" id="edit-occupation" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="edit-email" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">メモ</label>
            <textarea id="edit-memo" class="form-input" rows="3"></textarea>
          </div>
          
          <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
            <button type="button" class="btn btn-outline" id="btn-cancel-edit" style="flex: 1;">キャンセル</button>
            <button type="submit" class="btn" id="btn-save-customer" style="flex: 1;">保存する</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  
<script src="admin.js?v=1788232266158"></script>
</body>
</html>
