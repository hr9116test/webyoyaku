<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { 
      font-family: 'Noto Sans JP', sans-serif; 
      background-color: #F0F2F5; 
      margin: 0; 
      padding: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header { background-color: var(--color-text-main); color: white; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; flex-shrink: 0; }
    .header h1 { color: white; font-size: 1.2rem; margin: 0; }
    .meta-info { font-size: 0.85rem; color: var(--color-text-sub); }
    
    .btn-block-action {
      background-color: #555 !important;
      color: #fff !important;
      border-color: #555 !important;
    }
    .btn-outline.btn-block-action {
      background-color: transparent !important;
      color: #555 !important;
      border-color: #999 !important;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>HR 予約管理システム</h1>
  </header>

  <div id="login-overlay" style="display: flex; align-items: center; justify-content: center; flex: 1; background: var(--color-base); z-index: 9999;">
    <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
      <h2 style="margin-bottom: 1.5rem; color: var(--color-primary);">管理画面ログイン</h2>
      <div class="form-group">
        <input type="password" id="admin-password" class="form-input" placeholder="パスワードを入力" style="text-align: center;">
      </div>
      <button class="btn btn-full" id="btn-login">ログイン</button>
      <div id="login-error" style="color: #d32f2f; margin-top: 1rem; font-size: 0.9rem; display: none;">パスワードが間違っています。</div>
    </div>
  </div>

  <div class="admin-container d-none" id="main-admin-content">
    
    <div class="admin-layout">
      <!-- Sidebar Controls -->
      <div class="card admin-sidebar" style="padding: 1rem;">
        
        <!-- Date -->
        <div class="admin-sidebar-section">
          <div style="display: flex; gap: 0.5rem; align-items: center; justify-content: space-between;">
            <button class="btn btn-outline" id="prev-day" style="padding: 0.5rem 1rem;">&lt;</button>
            <div style="position: relative; width: 100%;">
              <input type="date" id="current-date" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2;">
              <div id="date-display" class="form-input" style="width: 100%; text-align: center; padding: 0.5rem; background-color: var(--color-surface); pointer-events: none; z-index: 1;">
                2026/08/15 (土)
              </div>
            </div>
            <button class="btn btn-outline" id="next-day" style="padding: 0.5rem 1rem;">&gt;</button>
          </div>
        </div>
        
        <!-- Action Tabs -->
        <div class="admin-sidebar-section" style="margin-top: 1rem;">
          
          <div style="display: flex; gap: 0.25rem; margin-bottom: 1rem;">
            <button class="btn btn-outline btn-full tab-toggle" id="btn-tab-booking" style="flex: 1; padding: 0.5rem 0; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
              <span>電話予約</span>
            </button>
            <button class="btn btn-outline btn-full tab-toggle" id="btn-tab-block" style="flex: 1; padding: 0.5rem 0; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
              <span>枠ブロック</span>
            </button>
            <button class="btn btn-outline btn-full tab-toggle" id="btn-tab-customer" style="flex: 1; padding: 0.5rem 0; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
              <span>顧客データ</span>
            </button>
          </div>

          <!-- Tab Contents -->
          
          <!-- 1. Phone Booking Content -->
          <div id="tab-content-booking" class="tab-content" style="display: none; margin-bottom: 1rem; padding-top: 0.5rem; border-top: 2px solid var(--color-primary);">
            
            <button type="button" class="btn btn-outline btn-full" id="menu-dropdown-toggle" style="text-align: left; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <strong id="menu-dropdown-text">メニューを選択</strong>
              <span id="menu-dropdown-icon">▼</span>
            </button>

            <div id="menu-buttons" class="menu-buttons-container" style="display: none; max-height: 250px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 0.5rem; background: var(--color-base);">
              <!-- Dynamically generated from GAS -->
            </div>
          </div>

          <!-- 2. Block Slots Content -->
          <div id="tab-content-block" class="tab-content" style="display: none; margin-bottom: 1rem; padding-top: 0.5rem; border-top: 2px solid var(--color-primary);">
            <button type="button" class="btn btn-outline btn-block-action btn-full" id="btn-block-mode">開始</button>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
              <button class="btn btn-block-action d-none btn-full" id="btn-block-confirm" style="flex: 1;">設定</button>
              <button class="btn btn-outline btn-block-action d-none btn-full" id="btn-block-cancel" style="flex: 1;">解除</button>
            </div>
          </div>
          
        </div>

      </div>

      <!-- Timeline Grid -->
      <div class="timeline-container" id="timeline" style="flex: 1; overflow-y: auto;">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- Booking Modal -->
  <div id="booking-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem; position: relative; max-height: 90vh; overflow-y: auto;">
      <h3 class="mb-4 text-center">予約の登録</h3>
      
      <div style="background-color: var(--color-base); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
        <div class="mb-2" id="modal-datetime" style="font-size: 1.1rem; font-weight: bold; color: var(--color-text-main);">2026/08/15 (土) 10:00 〜</div>
        <div style="font-weight: bold;" id="modal-menu">カット (60分)</div>
        <div class="meta-info mt-1" id="modal-staff">担当: スタッフA</div>
      </div>

      <form id="proxy-booking-form">
        <div class="form-group">
          <label class="form-label">お客様名 (必須)</label>
          <div class="autocomplete-wrapper">
            <input type="text" id="proxy-name" class="form-input" required autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-list d-none"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">電話番号 (必須)</label>
          <input type="tel" id="proxy-phone" class="form-input" required>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="button" class="btn btn-outline btn-full" id="btn-close-modal">キャンセル</button>
          <button type="submit" class="btn btn-full">予約を確定</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Details & Cancel Modal -->
  <div id="details-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem; position: relative; max-height: 90vh; overflow-y: auto;">
      <h3 class="mb-4 text-center">予約の詳細</h3>
      
      <div style="background-color: var(--color-base); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
        <div class="mb-2" id="detail-datetime" style="font-size: 1.1rem; font-weight: bold; color: var(--color-text-main);"></div>
        <div style="font-weight: bold;" id="detail-menu"></div>
        <div class="meta-info mt-1" id="detail-staff"></div>
        
        <div class="d-none mt-3" id="detail-memo-container">
          <div style="color: #d32f2f; font-weight: bold; font-size: 0.85rem; margin-bottom: 0.25rem;">ご要望・メモ</div>
          <div id="detail-memo" style="font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; background-color: rgba(255, 255, 255, 0.6); padding: 0.5rem; border-radius: 4px;"></div>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">お客様名</label>
        <div id="detail-name" style="font-size: 1.1rem; font-weight: bold; color: var(--color-primary); cursor: pointer; text-decoration: underline;"></div>
      </div>
      
      <div class="form-group d-none" id="detail-phone-container">
        <label class="form-label">電話番号</label>
        <div id="detail-phone" style="font-size: 1.1rem; font-weight: bold;"></div>
      </div>
      



      <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2rem;">
        <button type="button" class="btn btn-outline btn-full" style="color: #721C24; border-color: #721C24;" id="btn-cancel-booking">予約をキャンセル(削除)</button>
        <button type="button" class="btn btn-outline btn-full" id="btn-close-details">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Customer Data Modal (View from Booking) -->
  <div id="customer-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem; position: relative; max-height: 90vh; overflow-y: auto; padding: 1.25rem;">
      <h3 class="mb-3 text-center" style="font-size: 1.1rem; color: var(--color-primary); margin-top: 0;">顧客データ</h3>
      
      <div style="background: var(--color-base); border-radius: var(--radius-sm); border: 1px solid var(--color-border); overflow: hidden; margin-bottom: 1.25rem;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 0;">
          <tbody>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); width: 35%; color: var(--color-text-sub); font-weight: normal;">お客様名</th>
              <td style="padding: 0.5rem; font-weight: bold; color: var(--color-text-main);"><div id="customer-name"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">ふりがな</th>
              <td style="padding: 0.5rem;"><div id="customer-kana"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">住所(市町村)</th>
              <td style="padding: 0.5rem;"><div id="customer-address"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">職業</th>
              <td style="padding: 0.5rem;"><div id="customer-occupation"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">電話番号</th>
              <td style="padding: 0.5rem; font-weight: bold;"><div id="customer-phone"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">メール</th>
              <td style="padding: 0.5rem; font-weight: bold; word-break: break-all;"><div id="customer-email"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">初回予約日</th>
              <td style="padding: 0.5rem;"><div id="customer-first-visit"></div></td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal;">最終来店日</th>
              <td style="padding: 0.5rem;"><div id="customer-last-visit"></div></td>
            </tr>
            <tr>
              <th style="padding: 0.5rem; text-align: left; background: rgba(0,0,0,0.02); color: var(--color-text-sub); font-weight: normal; vertical-align: top;">メモ</th>
              <td style="padding: 0.5rem;"><div id="customer-notes" style="white-space: pre-wrap; font-size: 0.85rem; line-height: 1.4;"></div></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div>
        <button type="button" class="btn btn-outline btn-full" id="btn-close-customer">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Customer Management Modal (Edit/Register) -->
  <div id="customer-mgmt-modal" class="d-none" style="position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 600px; margin: 1rem; position: relative; max-height: 90vh; overflow-y: hidden; display: flex; flex-direction: column; padding: 1.25rem;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="margin: 0; font-size: 1.2rem;">顧客データ管理</h3>
        <button id="btn-close-mgmt" style="background:none; border:none; font-size: 1.5rem; cursor: pointer; color: var(--color-text-sub);">&times;</button>
      </div>

      <!-- List/Search View -->
      <div id="customer-list-view" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
          <input type="text" id="customer-search-input" class="form-input" placeholder="名前・ふりがな・電話番号で検索" style="flex: 1;">
          <button class="btn" id="btn-new-customer" style="white-space: nowrap;">＋ 新規登録</button>
        </div>
        
        <div style="background: var(--color-base); border-radius: var(--radius-sm); border: 1px solid var(--color-border); flex: 1; overflow-y: auto;">
          <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left;">
            <thead style="background: rgba(0,0,0,0.02); position: sticky; top: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
              <tr>
                <th style="padding: 0.75rem; border-bottom: 1px solid var(--color-border); color: var(--color-text-sub);">名前</th>
                <th style="padding: 0.75rem; border-bottom: 1px solid var(--color-border); color: var(--color-text-sub);">電話番号</th>
                <th style="padding: 0.75rem; border-bottom: 1px solid var(--color-border); color: var(--color-text-sub);"></th>
              </tr>
            </thead>
            <tbody id="customer-tbody">
              <!-- JS Populated -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Edit/Register Form View -->
      <div id="customer-form-view" class="d-none" style="flex: 1; overflow-y: auto; padding-right: 0.5rem;">
        <h4 id="customer-form-title" style="margin-top: 0; margin-bottom: 1rem; color: var(--color-primary);">顧客の登録・編集</h4>
        <form id="customer-edit-form">
          <input type="hidden" id="edit-customer-id">
          
          <div class="form-group">
            <label class="form-label">お客様名 (必須)</label>
            <input type="text" id="edit-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">ふりがな</label>
            <input type="text" id="edit-kana" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">電話番号</label>
            <input type="tel" id="edit-phone" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">住所（市町村）</label>
            <input type="text" id="edit-address" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">職業</label>
            <input type="text" id="edit-occupation" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="edit-email" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">メモ</label>
            <textarea id="edit-memo" class="form-input" rows="3"></textarea>
          </div>
          
          <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
            <button type="button" class="btn btn-outline" id="btn-cancel-edit" style="flex: 1;">キャンセル</button>
            <button type="submit" class="btn" id="btn-save-customer" style="flex: 1;">保存する</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script>
// admin.js
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx-b6WOncIt4M8nPkncMZfLDYc1MoV55tOvtL-cCT3ARdTSsZcMFUyk4d_J9Ur51cWi/exec';

document.addEventListener('DOMContentLoaded', () => {
  const tabs = document.querySelectorAll('.tab');
  const tabContents = document.querySelectorAll('.tab-content');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });

  // Calendar State
  let currentMonth = new Date().getMonth();
  let currentYear = new Date().getFullYear();
  let menus = [];
  let staffs = [];
  let mockBookings = [];

  const fetchAdminData = () => {
    document.getElementById('admin-loading').style.display = 'flex';
    fetch(`${GAS_URL}?action=getInitialData`)
      .then(res => res.json())
      .then(result => {
        if(result.success) {
          menus = result.data.menus.map(m => ({
            id: m['メニューID'], name: m['メニュー名'], duration: parseInt(m['所要時間（分）']), price: m['金額']
          }));
          staffs = result.data.staffs.map(s => ({
            id: s['スタッフID'], name: s['スタッフ名']
          }));
          mockBookings = result.data.bookings.map(b => ({
            id: b['予約ID'],
            date: String(b['予約日']).substring(0, 10),
            startTime: String(b['開始時間']).padStart(5, '0').substring(0, 5),
            duration: parseInt(b['所要時間（分）']),
            staff: b['担当スタッフ'],
            type: b['予約状況'],
            name: b['お客様名'],
            phone: b['電話番号'],
            menu: b['メニュー名'],
            memo: b['メモ']
          }));
          
          document.getElementById('admin-loading').style.display = 'none';
          renderCalendar();
          renderCustomerList();
          renderSettings();
        } else {
          alert('データの取得に失敗しました: ' + result.error);
        }
      })
      .catch(err => {
        alert('通信エラー: ' + err.message);
        document.getElementById('admin-loading').style.display = 'none';
      });
  };

  fetchAdminData();

  // Schedule View (Calendar & timeline)
  const renderCalendar = () => {
    const calendarGrid = document.querySelector('.calendar-grid');
    const oldDays = calendarGrid.querySelectorAll('.calendar-day, .calendar-empty');
    oldDays.forEach(day => day.remove());

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    
    document.getElementById('admin-month-year').innerText = `${currentYear}年 ${currentMonth + 1}月`;

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'calendar-empty';
      calendarGrid.appendChild(empty);
    }

    const today = new Date();
    today.setHours(0,0,0,0);
    
    for (let i = 1; i <= daysInMonth; i++) {
      const dayEl = document.createElement('div');
      dayEl.className = 'calendar-day';
      dayEl.innerText = i;
      
      const thisDate = new Date(currentYear, currentMonth, i);
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
      
      const dayBookings = mockBookings.filter(b => b.date === dateStr);
      if (dayBookings.length > 0) {
        const badge = document.createElement('div');
        badge.className = 'booking-badge';
        badge.innerText = dayBookings.length;
        dayEl.appendChild(badge);
      }
      
      dayEl.addEventListener('click', () => {
        document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('selected'));
        dayEl.classList.add('selected');
        renderTimeline(dateStr);
      });
      
      calendarGrid.appendChild(dayEl);
    }
  };

  document.getElementById('btn-admin-prev').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  });
  document.getElementById('btn-admin-next').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  });

  const timelineContainer = document.getElementById('timeline-container');
  const modal = document.getElementById('booking-modal');
  const btnCloseModal = document.getElementById('btn-close-modal');

  function timeToMinutes(timeStr) {
    if(!timeStr || typeof timeStr !== 'string') return 0;
    const [h, m] = timeStr.split(':').map(Number);
    return h * 60 + m;
  }

  // --- UI Elements for Edit/Block ---
  const bookingDetailView = document.getElementById('booking-detail-view');
  const bookingEditView = document.getElementById('booking-edit-view');
  const blockSettingsView = document.getElementById('block-settings-view');
  
  const btnEditBooking = document.getElementById('btn-edit-booking');
  const btnCancelBooking = document.getElementById('btn-cancel-booking'); // キャンセルボタン
  const btnSaveBooking = document.getElementById('btn-save-booking');
  const btnCancelEdit = document.getElementById('btn-cancel-edit');
  
  const blockMenuSelect = document.getElementById('block-menu-select');
  const blockDurationInput = document.getElementById('block-duration');
  const btnSaveBlock = document.getElementById('btn-save-block');
  const btnCancelBlock = document.getElementById('btn-cancel-block');

  let selectedMenuDuration = 0;
  let selectedMenuName = '';
  let selectedMenuType = 'booked';
  let currentDetailId = null;
  let isBlockMode = false;
  let selectedBlockSlots = []; // ["staffA-09:00", ...]
  let currentTimelineDate = '';

  const renderTimeline = (dateStr) => {
    currentTimelineDate = dateStr;
    timelineContainer.innerHTML = '';
    const dayBookings = mockBookings.filter(b => b.date === dateStr);
    
    // Check if it's weekend
    const dObj = new Date(dateStr);
    const isWeekend = dObj.getDay() === 0 || dObj.getDay() === 6;
    let startHour = 9;
    let startMin = isWeekend ? 0 : 30;
    
    const startMins = startHour * 60 + startMin;
    const endMins = 19 * 60; // Up to 19:00 boundary
    const slotMins = 30;

    const table = document.createElement('table');
    table.className = 'timeline-table';
    
    const thead = document.createElement('thead');
    let headRow = '<tr><th>時間</th>';
    staffs.forEach(s => {
      headRow += `<th>${s.name}</th>`;
    });
    headRow += '</tr>';
    thead.innerHTML = headRow;
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    
    for(let m = startMins; m < endMins; m += slotMins) {
      const h = Math.floor(m / 60);
      const min = m % 60;
      const timeString = `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
      
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${timeString}</td>`;
      
      staffs.forEach(staff => {
        const td = document.createElement('td');
        const slotKey = `${staff.id}-${timeString}`;
        
        // Find if this slot is covered by any booking for this staff
        const booking = dayBookings.find(b => {
          if (b.staff !== staff.id) return false;
          const bStart = timeToMinutes(b.startTime);
          const bEnd = bStart + b.duration;
          return m >= bStart && m < bEnd;
        });

        if (booking) {
          td.classList.add('booked');
          if (booking.type === 'blocked') {
            td.classList.add('blocked');
          }
          if (m === timeToMinutes(booking.startTime)) {
            td.innerHTML = `<div class="booking-item">${booking.name || '休み設定'}<br><small>${booking.menu || ''}</small></div>`;
            td.addEventListener('click', () => openBookingModal(booking));
          } else {
            // Continuation of booking
            td.classList.add('booking-continued');
          }
        } else {
          // Free slot
          td.dataset.slot = slotKey;
          td.addEventListener('click', () => handleEmptySlotClick(td, slotKey));
        }
        
        tr.appendChild(td);
      });
      
      tbody.appendChild(tr);
    }
    
    table.appendChild(tbody);
    timelineContainer.appendChild(table);
  };

  const handleEmptySlotClick = (td, slotKey) => {
    if (!isBlockMode) return;
    
    if (selectedBlockSlots.includes(slotKey)) {
      selectedBlockSlots = selectedBlockSlots.filter(k => k !== slotKey);
      td.classList.remove('selected-for-block');
    } else {
      selectedBlockSlots.push(slotKey);
      td.classList.add('selected-for-block');
    }
  };

  const openBookingModal = (booking) => {
    currentDetailId = booking.id;
    bookingDetailView.style.display = 'block';
    bookingEditView.style.display = 'none';
    blockSettingsView.style.display = 'none';

    document.getElementById('detail-name').innerText = booking.name || '-';
    document.getElementById('detail-phone').innerText = booking.phone || '-';
    document.getElementById('detail-datetime').innerText = `${booking.date} ${booking.startTime}〜`;
    document.getElementById('detail-menu').innerText = booking.menu || '-';
    document.getElementById('detail-staff').innerText = staffs.find(s=>s.id===booking.staff)?.name || booking.staff;
    document.getElementById('detail-memo').innerText = booking.memo || '-';

    // 休み設定の場合はキャンセル（削除）のみ可能にするなど
    if (booking.type === 'blocked') {
      btnEditBooking.style.display = 'none';
    } else {
      btnEditBooking.style.display = 'inline-block';
    }

    modal.classList.add('active');
  };

  btnCloseModal.addEventListener('click', () => {
    modal.classList.remove('active');
  });

  // Edit Mode
  btnEditBooking.addEventListener('click', () => {
    const booking = mockBookings.find(b => b.id === currentDetailId);
    if(!booking) return;

    bookingDetailView.style.display = 'none';
    bookingEditView.style.display = 'block';

    document.getElementById('edit-name').value = booking.name;
    document.getElementById('edit-phone').value = booking.phone;
    document.getElementById('edit-date').value = booking.date.replace(/\//g, '-');
    document.getElementById('edit-time').value = booking.startTime;
    document.getElementById('edit-menu').value = booking.menu;
    document.getElementById('edit-staff').value = booking.staff;
    document.getElementById('edit-memo').value = booking.memo;
  });

  btnCancelEdit.addEventListener('click', () => {
    bookingDetailView.style.display = 'block';
    bookingEditView.style.display = 'none';
  });

  // Save Edit (Status Update Only API implemented, but let's simulate full save locally or call status update)
  btnSaveBooking.addEventListener('click', () => {
    const booking = mockBookings.find(b => b.id === currentDetailId);
    if(!booking) return;

    btnSaveBooking.innerText = '保存中...';
    btnSaveBooking.disabled = true;

    // 今回はローカルのmockデータを更新するだけ（本来はGASへupdateリクエスト）
    setTimeout(() => {
      booking.name = document.getElementById('edit-name').value;
      booking.phone = document.getElementById('edit-phone').value;
      booking.date = document.getElementById('edit-date').value.replace(/-/g, '/');
      booking.startTime = document.getElementById('edit-time').value;
      booking.menu = document.getElementById('edit-menu').value;
      booking.staff = document.getElementById('edit-staff').value;
      booking.memo = document.getElementById('edit-memo').value;

      btnSaveBooking.innerText = '保存する';
      btnSaveBooking.disabled = false;
      modal.classList.remove('active');
      renderTimeline(currentTimelineDate);
      alert('予約情報を更新しました（デモ）');
    }, 500);
  });

  // Cancel Booking (Delete or Status change)
  btnCancelBooking.addEventListener('click', () => {
    if(!confirm("この予約をキャンセル（削除）しますか？")) return;
    
    btnCancelBooking.innerText = '処理中...';
    btnCancelBooking.disabled = true;

    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'updateBookingStatus', id: currentDetailId, status: 'キャンセル' })
    })
    .then(res => res.json())
    .then(result => {
      if(result.success) {
        // ローカルから削除
        mockBookings = mockBookings.filter(b => b.id !== currentDetailId);
        renderTimeline(currentTimelineDate);
        modal.classList.remove('active');
        alert('予約をキャンセルしました');
      } else {
        alert('エラー: ' + result.error);
      }
    })
    .catch(err => alert('通信エラー: ' + err.message))
    .finally(() => {
      btnCancelBooking.innerText = '予約をキャンセル';
      btnCancelBooking.disabled = false;
    });
  });

  // --- Block Mode Toggle ---
  document.getElementById('btn-toggle-block').addEventListener('click', (e) => {
    isBlockMode = !isBlockMode;
    selectedBlockSlots = [];
    if (isBlockMode) {
      e.target.classList.add('btn-danger');
      e.target.innerText = '枠を押さえる（選択中...）';
      timelineContainer.classList.add('block-mode-active');
      document.getElementById('block-action-bar').style.display = 'block';
    } else {
      e.target.classList.remove('btn-danger');
      e.target.innerText = '枠を押さえる';
      timelineContainer.classList.remove('block-mode-active');
      document.getElementById('block-action-bar').style.display = 'none';
      renderTimeline(currentTimelineDate); // refresh to clear selections
    }
  });

  document.getElementById('btn-open-block-modal').addEventListener('click', () => {
    if (selectedBlockSlots.length === 0) {
      alert("枠が選択されていません");
      return;
    }
    
    // Populate menu select
    blockMenuSelect.innerHTML = `<option value="">-- メニューを選択 --</option>
      <option value="休み設定">休み（ブロック）</option>`;
    menus.forEach(m => {
      blockMenuSelect.innerHTML += `<option value="${m.name}" data-duration="${m.duration}">${m.name}</option>`;
    });

    bookingDetailView.style.display = 'none';
    bookingEditView.style.display = 'none';
    blockSettingsView.style.display = 'block';
    
    modal.classList.add('active');
  });

  blockMenuSelect.addEventListener('change', (e) => {
    if (e.target.value === '休み設定') {
      blockDurationInput.value = 30; // 最小単位
      selectedMenuDuration = 30;
      selectedMenuName = '休み';
      selectedMenuType = 'blocked';
    } else {
      const option = e.target.options[e.target.selectedIndex];
      selectedMenuDuration = parseInt(option.dataset.duration) || 0;
      blockDurationInput.value = selectedMenuDuration;
      selectedMenuName = e.target.value;
      selectedMenuType = 'booked';
    }
  });

  btnSaveBlock.addEventListener('click', () => {
    if (selectedBlockSlots.length === 0) return;
    
    btnSaveBlock.innerText = '保存中...';
    btnSaveBlock.disabled = true;

    // Prepare requests (Since GAS handles one by one or needs bulk API, we will just loop for demo, but better to use bulk)
    // Here we just mock it locally and send one request for the first slot to demonstrate.
    const firstSlot = selectedBlockSlots[0];
    const [staffId, time] = firstSlot.split('-');

    const payload = {
      date: currentTimelineDate,
      startTime: time,
      duration: parseInt(blockDurationInput.value),
      staff: staffId,
      name: document.getElementById('block-customer-name').value || '休み',
      phone: '',
      email: '',
      memo: document.getElementById('block-memo').value,
      menu: selectedMenuName,
      type: selectedMenuType
    };

    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'createBooking', payload })
    })
    .then(res => res.json())
    .then(result => {
      if(result.success) {
        // Add to local mock data
        mockBookings.push({
          id: result.bookingId || ('MOCK-' + Date.now()),
          date: payload.date,
          startTime: payload.startTime,
          duration: payload.duration,
          staff: payload.staff,
          type: payload.type,
          name: payload.name,
          phone: payload.phone,
          menu: payload.menu,
          memo: payload.memo
        });
        
        modal.classList.remove('active');
        // Reset block mode
        document.getElementById('btn-toggle-block').click(); 
        renderTimeline(currentTimelineDate);
      } else {
        alert('エラー: ' + result.error);
      }
    })
    .catch(err => alert('通信エラー: ' + err.message))
    .finally(() => {
      btnSaveBlock.innerText = 'この内容で登録';
      btnSaveBlock.disabled = false;
    });

  });

  btnCancelBlock.addEventListener('click', () => {
    modal.classList.remove('active');
  });

  // --- Customer View ---
  const renderCustomerList = () => {
    // 顧客リストはbookingsから一意に抽出（実際はGASから顧客シートを取得するAPIを別途作る）
    const customerMap = {};
    mockBookings.forEach(b => {
      if(b.name && b.name !== '休み') {
        if(!customerMap[b.phone]) {
          customerMap[b.phone] = { name: b.name, phone: b.phone, count: 1, lastVisit: b.date };
        } else {
          customerMap[b.phone].count++;
          if (b.date > customerMap[b.phone].lastVisit) {
            customerMap[b.phone].lastVisit = b.date;
          }
        }
      }
    });

    const tbody = document.getElementById('customer-list-body');
    tbody.innerHTML = '';
    Object.values(customerMap).forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.name}</td>
        <td>${c.phone}</td>
        <td>${c.count}回</td>
        <td>${c.lastVisit}</td>
        <td><button class="btn btn-sm">詳細</button></td>
      `;
      tbody.appendChild(tr);
    });
  };

  // --- Settings View ---
  const renderSettings = () => {
    document.getElementById('setting-menus').innerText = menus.map(m => m.name).join(', ');
    document.getElementById('setting-staffs').innerText = staffs.map(s => s.name).join(', ');
  };
});

</script>
</body>
</html>
