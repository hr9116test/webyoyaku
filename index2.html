<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEB予約 | HAIR SALON HR</title>
  
  <!-- Google Fonts: Noto Serif JP & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=1.1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  

  <style>
    .sticky-footer {
      position: sticky;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 1rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 10;
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
      margin: 1rem -1rem -1rem -1rem;
    }
    .sticky-footer .totals {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: var(--color-text-main);
    }
    .sticky-footer .totals span {
      font-size: 1.2rem;
      color: var(--color-accent);
    }
  </style>

</head>

<body>
  
  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="../hp/index.html" class="logo">HAIR SALON HR</a>
      <h1 class="page-title">WEB予約</h1>
    </div>
  </header>

  <!-- Main Booking App -->
  <main class="container">
    <div class="booking-wrapper">
      
      <!-- Stepper -->
      <div class="stepper">
        <div class="step active" data-step="1">
          <div class="step-circle">1</div>
          <span>メニュー</span>
        </div>
        <div class="step" data-step="2">
          <div class="step-circle">2</div>
          <span>スタッフ</span>
        </div>
        <div class="step" data-step="3">
          <div class="step-circle">3</div>
          <span>日時</span>
        </div>
        <div class="step" data-step="4">
          <div class="step-circle">4</div>
          <span>確認</span>
        </div>
      </div>

      <!-- Step 1: Menu Selection -->
      
      <section id="step-1" class="step-content">
        <h2 class="mb-4 text-center">メニューを選ぶ(複数選択可)</h2>
        <div class="selection-grid" id="menu-list" style="margin-bottom: 2rem; grid-template-columns: repeat(2, 1fr);">
          <div id="loading-indicator" style="grid-column: 1 / -1; text-align: center; padding: 2rem; color: var(--color-text-sub);">
            データを読み込んでいます...
          </div>
        </div>
        
        <div class="sticky-footer d-none" id="menu-footer">
          <div class="totals">
            <div>合計時間: <span id="total-duration">0</span>分</div>
            <div>合計金額: <span id="total-price" style="font-size:1.2rem;">¥0</span></div>
          </div>
          <button class="btn btn-primary" id="btn-next-1" style="width: 100%;">次へ進む</button>
        </div>
      </section>


      <!-- Step 2: Staff Selection -->
      <section id="step-2" class="step-content d-none">
        <h2 class="mb-4 text-center">担当スタッフを選択</h2>
        <div class="selection-grid" id="staff-grid">
          <!-- Staff items injected via JS -->
        </div>
        <div class="step-actions mt-4" style="margin-bottom: 0;">
          <button class="btn btn-outline" id="btn-prev-2">戻る</button>
          <button class="btn btn-disabled" id="btn-next-2" disabled>次へ進む</button>
        </div>
      </section>

      <!-- Step 3: Date & Time Selection -->
      <section id="step-3" class="step-content d-none">
        <h2 class="mb-4 text-center">来店日時を選択</h2>
        
        <div class="calendar-wrapper">
          <div class="calendar-header">
            <button class="btn-icon" id="btn-prev-month">&lt;</button>
            <h3 id="calendar-month-year">2026年 8月</h3>
            <button class="btn-icon" id="btn-next-month">&gt;</button>
          </div>
          <div class="calendar-grid">
            <div class="calendar-day-header">日</div>
            <div class="calendar-day-header">月</div>
            <div class="calendar-day-header">火</div>
            <div class="calendar-day-header">水</div>
            <div class="calendar-day-header">木</div>
            <div class="calendar-day-header">金</div>
            <div class="calendar-day-header">土</div>
            <!-- Days injected via JS -->
          </div>
        </div>

        <div id="time-selection" class="d-none mt-4">
          <h3 class="mb-2 text-center" id="selected-date-display" style="font-size: 1.1rem;"></h3>
          <div class="time-slots" id="time-slots-container">
            <!-- Time slots injected via JS -->
          </div>
        </div>

        <div class="step-actions mt-4" style="margin-bottom: 0;">
          <button class="btn btn-outline" id="btn-prev-3">戻る</button>
          <button class="btn btn-disabled" id="btn-next-3" disabled>次へ進む</button>
        </div>
      </section>

      <!-- Step 4: Confirmation & Info -->
      <section id="step-4" class="step-content d-none">
        <h2 class="mb-4 text-center">予約内容の確認</h2>
        
        <div style="background-color: var(--color-base); padding: 1.75rem 1.5rem; border-radius: var(--radius-sm); margin-bottom: 2rem; font-size: 1.15rem;">
            <p style="margin-bottom: 1rem;"><strong>日時:</strong> <span id="confirm-datetime" style="margin-left: 0.5rem;"></span></p>
            <p style="margin-bottom: 1rem;"><strong>メニュー:</strong> <span id="confirm-menu" style="margin-left: 0.5rem;"></span></p>
            <p style="margin-bottom: 0;"><strong>担当スタッフ:</strong> <span id="confirm-staff" style="margin-left: 0.5rem;"></span></p>
          </div>

        <form id="booking-form">
          <div class="form-group">
            <label for="user-name" class="form-label">お名前 <span style="font-size: 0.75rem; color: #fff; background: var(--color-accent); padding: 2px 6px; border-radius: 4px; margin-left: 0.5rem;">必須</span></label>
            <input type="text" id="user-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="user-phone" class="form-label">電話番号 <span style="font-size: 0.75rem; color: #fff; background: var(--color-accent); padding: 2px 6px; border-radius: 4px; margin-left: 0.5rem;">必須</span></label>
            <input type="tel" id="user-phone" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="user-email" class="form-label">メールアドレス</label>
            <input type="email" id="user-email" class="form-input">
            <div style="font-size: 0.75rem; color: var(--color-text-sub); margin-top: 0.4rem; letter-spacing: -0.02em;">※予約確定メールをお送りします</div>
          </div>
          <div class="form-group">
            <label for="user-memo" class="form-label">ご要望・メモ</label>
            <textarea id="user-memo" class="form-input" rows="3"></textarea>
          </div>

          <div class="step-actions mt-4" style="margin-bottom: 0;">
            <button type="button" class="btn btn-outline" id="btn-prev-4">戻る</button>
            <button type="submit" class="btn">予約を確定する</button>
          </div>
        </form>
      </section>

      <!-- Success Step -->
      <section id="step-success" class="step-content d-none" style="text-align: center; padding: 3rem 1rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1.5rem;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <h2 class="mb-4" style="color: var(--color-text-main);">予約が完了しました</h2>
        <p class="mb-4" style="color: var(--color-text-sub);">スタッフ一同、心よりお待ちしております。<br>ご入力いただいたメールアドレスへ、予約内容の詳細をお送りしました。</p>
        <a href="#" class="btn btn-outline" id="btn-return-top">トップへ戻る</a>
      </section>

    </div>
  </main>

  <script src="app2.js?v=1788299662667"></script>
</body>
</html>
