<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HairSalon HR | ご予約</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>HairSalon HR</h1>
  </header>

  <div class="container">
    <div id="booking-app">
      <!-- Stepper -->
      <div class="stepper" id="stepper">
        <div class="step active" data-step="1">
          <div class="step-circle">1</div>
          <span>メニュー</span>
        </div>
        <div class="step" data-step="2">
          <div class="step-circle">2</div>
          <span>スタッフ</span>
        </div>
        <div class="step" data-step="3">
          <div class="step-circle">3</div>
          <span>日時</span>
        </div>
        <div class="step" data-step="4">
          <div class="step-circle">4</div>
          <span>確認</span>
        </div>
      </div>

      <!-- Step 1: Menu Selection -->
      <div id="step-1" class="step-content">
        <div class="card">
          <h2 class="mb-4 text-center">メニューを選択</h2>
          <div class="selection-grid" id="menu-grid">
            <div class="selection-card" data-menu="cut" data-time="60">
              <div class="selection-title">カット</div>
              <div class="selection-desc">約60分 / ￥3,780</div>
            </div>
            <div class="selection-card" data-menu="color" data-time="90">
              <div class="selection-title">カラー</div>
              <div class="selection-desc">約90分</div>
            </div>
            <div class="selection-card" data-menu="perm" data-time="120">
              <div class="selection-title">パーマ</div>
              <div class="selection-desc">約120分</div>
            </div>
          </div>
          <button class="btn btn-full btn-disabled" id="btn-next-1" disabled>次へ進む</button>
        </div>
      </div>

      <!-- Step 2: Staff Selection -->
      <div id="step-2" class="step-content d-none">
        <div class="card">
          <h2 class="mb-4 text-center">スタッフを選択</h2>
          <div class="selection-grid" id="staff-grid">
            <div class="selection-card" data-staff="none">
              <div class="selection-title">指名なし</div>
              <div class="selection-desc">どのスタッフでもOK</div>
            </div>
            <div class="selection-card" data-staff="staffA">
              <div class="selection-title">スタッフA</div>
              <div class="selection-desc">オーナースタイリスト</div>
            </div>
            <div class="selection-card" data-staff="staffB">
              <div class="selection-title">スタッフB</div>
              <div class="selection-desc">スタイリスト</div>
            </div>
          </div>
          <div class="step-actions" style="margin-bottom: 0;">
            <button class="btn btn-outline" id="btn-prev-2">戻る</button>
            <button class="btn btn-disabled" id="btn-next-2" disabled>次へ進む</button>
          </div>
        </div>
      </div>

      <!-- Step 3: Date & Time Selection -->
      <div id="step-3" class="step-content d-none">
        <div class="card">
          <h2 class="mb-4 text-center">ご希望の日時を選択</h2>
          
          <div class="calendar-wrapper">
            <div class="calendar-header">
              <button class="btn btn-outline" id="btn-prev-month">&lt;</button>
              <h3 id="current-month-year">2026年 8月</h3>
              <button class="btn btn-outline" id="btn-next-month">&gt;</button>
            </div>
            <div class="calendar-grid">
              <div class="calendar-day-header">日</div>
              <div class="calendar-day-header">月</div>
              <div class="calendar-day-header">火</div>
              <div class="calendar-day-header">水</div>
              <div class="calendar-day-header">木</div>
              <div class="calendar-day-header">金</div>
              <div class="calendar-day-header">土</div>
              <!-- Calendar days will be generated by JS -->
            </div>
          </div>

          <div id="time-selection" class="d-none">
            <h3 class="mb-2 text-center" id="selected-date-display"></h3>
            <div class="time-slots" id="time-slots-container">
              <!-- Time slots will be generated by JS -->
            </div>
          </div>

          <div class="step-actions mt-4" style="margin-bottom: 0;">
            <button class="btn btn-outline" id="btn-prev-3">戻る</button>
            <button class="btn btn-disabled" id="btn-next-3" disabled>次へ進む</button>
          </div>
        </div>
      </div>

      <!-- Step 4: Confirmation & Info Input -->
      <div id="step-4" class="step-content d-none">
        <div class="card">
          <h2 class="mb-4 text-center">ご予約内容の確認</h2>
          
          <div style="background-color: var(--color-base); padding: 1.5rem; border-radius: var(--radius-sm); margin-bottom: 2rem;">
            <p><strong>メニュー:</strong> <span id="confirm-menu"></span></p>
            <p><strong>スタッフ:</strong> <span id="confirm-staff"></span></p>
            <p><strong>日時:</strong> <span id="confirm-datetime"></span></p>
          </div>

          <form id="booking-form">
            <div class="form-group">
              <label class="form-label" for="user-name">お名前 (必須)</label>
              <input type="text" id="user-name" class="form-input" required placeholder="小布施 太郎">
            </div>
            <div class="form-group">
              <label class="form-label" for="user-phone">電話番号 (必須)</label>
              <input type="tel" id="user-phone" class="form-input" required placeholder="090-XXXX-XXXX">
            </div>
            <div class="form-group">
              <label class="form-label" for="user-email">メールアドレス (必須)</label>
              <input type="email" id="user-email" class="form-input" required placeholder="sample@example.com">
            </div>
            <div class="form-group">
              <label class="form-label" for="user-memo">ご要望など (任意)</label>
              <textarea id="user-memo" class="form-input" rows="3" placeholder="カラーの色味の相談をしたいです。"></textarea>
            </div>
            
            <div class="step-actions mt-4" style="margin-bottom: 0;">
              <button type="button" class="btn btn-outline" id="btn-prev-4">戻る</button>
              <button type="submit" class="btn">予約を確定する</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Success State -->
      <div id="step-success" class="step-content d-none">
        <div class="card text-center">
          <h2 class="mb-4" style="color: var(--color-success);">ご予約が完了しました</h2>
          <p class="mb-4">ご来店を心よりお待ちしております。<br>ご入力いただいたメールアドレスへ、予約内容の詳細をお送りしました。</p>
          <a href="index.html" class="btn btn-outline">トップへ戻る</a>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
